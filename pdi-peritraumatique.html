<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDI — Inventaire de détresse péritraumatique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{color-scheme:light}
  *{box-sizing:border-box;}
  body{margin:0;padding:0;background:#F4F1EA;color:#20241E;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;line-height:1.6;}
  h1,.serif{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;color:#20241E;}
  .wrap{max-width:720px;margin:0 auto;padding:0 24px 80px;}
  .eyebrow{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:#63695D;font-weight:600;display:flex;align-items:center;gap:10px;margin:32px 0 18px;}
  .eyebrow::before{content:"";width:26px;height:1px;background:#63695D;display:inline-block;}
  h1{font-size:25px;margin:0 0 18px;}
  .intro{font-size:14.5px;color:#4A4E43;background:#fff;border:1px solid #E0D9C9;border-radius:12px;padding:16px 18px;margin-bottom:24px;}
  .item{background:#fff;border:1px solid #E0D9C9;border-radius:12px;padding:16px 18px;margin-bottom:14px;}
  .item p{font-size:14.5px;margin:0 0 12px;}
  .opts{display:flex;flex-wrap:wrap;gap:8px;}
  .opt{display:flex;align-items:center;gap:6px;font-size:12.5px;cursor:pointer;padding:8px 10px;border:1px solid #E0D9C9;border-radius:999px;}
  .opt:hover{background:#F4F1EA;}
  .btn{appearance:none;text-decoration:none;display:inline-flex;align-items:center;gap:6px;font-family:'Inter',sans-serif;font-size:13.5px;font-weight:700;border-radius:10px;padding:12px 22px;cursor:pointer;border:1px solid transparent;background:#7A2E5C;color:#fff;margin-top:10px;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  #result{display:none;margin-top:30px;}
  .score-card{background:#fff;border:1px solid #E0D9C9;border-radius:12px;padding:18px 20px;margin-bottom:14px;}
  .score-card h3{margin:0 0 6px;font-size:16px;font-family:'Cormorant Garamond',Georgia,serif;}
  .score-val{font-size:22px;font-weight:700;}
  .cutoffs{font-size:12.5px;color:#63695D;margin-top:6px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Cabinet Bouche &amp; Chmura</div>
  <h1 class="serif">Inventaire de détresse péritraumatique (PDI)</h1>
  <div class="intro">
    Veuillez compléter les énoncés qui suivent, en cochant la case qui correspond le mieux à ce que
    vous avez ressenti pendant et immédiatement après l'événement qui est à l'origine de votre
    stress post-traumatique.
  </div>
  <div id="quiz"></div>
  <button class="btn" id="submitBtn" type="button" disabled>Voir mes résultats</button>

  <div id="result">
    <h2 class="serif">Vos résultats</h2>
    <div id="cards"></div>
  </div>
</div>

<script>
(function(){
  var OPTIONS = ["Pas du tout vrai","Un peu vrai","Moyennement vrai","Très vrai","Extrêmement vrai"];

  var ITEMS = [
    "Je ressentais de l'impuissance.",
    "Je ressentais de la tristesse et du chagrin.",
    "Je me sentais frustré(e) et en colère.",
    "J'avais peur pour ma propre sécurité.",
    "Je me sentais coupable.",
    "J'avais honte de mes réactions émotionnelles.",
    "J'étais inquiet(ète) pour la sécurité des autres.",
    "J'avais l'impression que j'allais perdre le contrôle de mes émotions.",
    "J'avais envie d'uriner et d'aller à la selle.",
    "J'étais horrifié(e).",
    "J'avais des réactions physiques comme des sueurs, des tremblements et des palpitations.",
    "Je sentais que je pourrais m'évanouir.",
    "Je pensais que je pourrais mourir."
  ];

  var answers = {};

  var quizEl = document.getElementById('quiz');
  var html = '';
  ITEMS.forEach(function(item, idx){
    html += '<div class="item"><p>' + (idx+1) + '. ' + item + '</p><div class="opts">';
    OPTIONS.forEach(function(opt, val){
      html += '<label class="opt"><input type="radio" name="q' + idx + '" value="' + val + '" style="display:none" data-idx="' + idx + '">' + opt + '</label>';
    });
    html += '</div></div>';
  });
  quizEl.innerHTML = html;

  var submitBtn = document.getElementById('submitBtn');

  quizEl.querySelectorAll('.opt').forEach(function(label){
    label.addEventListener('click', function(){
      var input = label.querySelector('input');
      var idx = input.getAttribute('data-idx');
      var group = quizEl.querySelectorAll('input[name="q' + idx + '"]');
      group.forEach(function(r){ r.closest('.opt').style.background = ''; r.closest('.opt').style.borderColor = '#E0D9C9'; r.closest('.opt').style.color=''; });
      label.style.background = '#7A2E5C';
      label.style.color = '#fff';
      label.style.borderColor = '#7A2E5C';
      answers[idx] = parseInt(input.value, 10);
      checkComplete();
    });
  });

  function checkComplete(){
    submitBtn.disabled = Object.keys(answers).length < ITEMS.length;
  }

  submitBtn.addEventListener('click', function(){
    var total = 0;
    ITEMS.forEach(function(item, idx){ total += answers[idx] || 0; });
    var cards = document.getElementById('cards');
    var html2 = '<div class="score-card"><h3>Score total de détresse péritraumatique</h3>' +
      '<div class="score-val">' + total + ' / 52</div>' +
      '<p class="cutoffs">Seuil indicatif : ≥ 14 associé à un risque accru de trouble lié au ' +
      'traumatisme (repères complémentaires : &lt;7 → faible probabilité de TSPT à 6 semaines ; ' +
      '&gt;28 → forte probabilité de TSPT complet ou partiel). Seuil indicatif, à intégrer dans une ' +
      'évaluation clinique globale.</p></div>';
    cards.innerHTML = html2;
    document.getElementById('result').style.display = 'block';
    submitBtn.style.display = 'none';
    document.getElementById('result').scrollIntoView({behavior:'smooth'});
  });
})();
</script>
</body>
</html>
