<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F4F1EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141A1F" media="(prefers-color-scheme: dark)">
<title>Bilan dissociatif | Cabinet Bouche &amp; Chmura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F1EA;
    --surface:#FFFFFF;
    --surface-2:#EAE6D9;
    --ink:#20241E;
    --ink-soft:#63695D;
    --line:#E0D9C9;
    --accent:#1E3A5F;
    --accent-ink:#F4F1EA;
    --accent-soft:#E1E7EC;
    --terracotta:#A0824C;
    --shadow: 0 1px 2px rgba(20,26,32,.06), 0 18px 34px -20px rgba(20,26,32,.28);
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#141A1F;
      --surface:#1B232B;
      --surface-2:#212B33;
      --ink:#E9E7DC;
      --ink-soft:#A7ADA0;
      --line:#2C3540;
      --accent:#3E6D9C;
      --accent-ink:#F4F1EA;
      --accent-soft:#22303B;
      --terracotta:#C9A46A;
      --shadow: 0 1px 2px rgba(0,0,0,.35), 0 24px 44px -22px rgba(0,0,0,.65);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#141A1F;
    --surface:#1B232B;
    --surface-2:#212B33;
    --ink:#E9E7DC;
    --ink-soft:#A7ADA0;
    --line:#2C3540;
    --accent:#7FA6C9;
    --accent-ink:#0F1418;
    --accent-soft:#22303B;
    --terracotta:#C9A46A;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 24px 44px -22px rgba(0,0,0,.65);
    color-scheme:dark;
  }

  *{box-sizing:border-box;}
  [hidden]{display:none!important;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--ink);
    font-family:'Inter',-apple-system,'Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.6;
    display:flex;flex-direction:column;
    /* Chiffres alignés partout (pas de chiffres « à l'ancienne ») */
    font-variant-numeric:lining-nums;font-feature-settings:"lnum" 1;
  }
  /* EB Garamond : accents correctement placés (Cormorant décalait é, ê, ô) */
  h1,h2,h3,.serif{
    font-family:'EB Garamond',Georgia,serif;
    font-weight:400;letter-spacing:0;text-wrap:pretty;color:var(--ink);
    font-variant-numeric:lining-nums;font-feature-settings:"lnum" 1;
  }
  h1{font-weight:500;text-wrap:balance;}
  em.en{font-style:italic;}
  strong.diff{font-weight:600;color:var(--ink);}
  a{color:inherit;}
  button{font:inherit;color:inherit;}

  /* ---------- En-tête ---------- */
  .top{
    position:sticky;top:0;z-index:5;background:var(--bg);
    padding:calc(14px + env(safe-area-inset-top)) 16px 0;
  }
  .top-in{max-width:680px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:34px;}
  .brand{font-family:'Cormorant Garamond',Georgia,serif;font-size:19px;font-weight:600;text-decoration:none;color:var(--ink);white-space:nowrap;}
  .save{font-size:12px;color:var(--ink-soft);display:flex;align-items:center;gap:7px;opacity:0;transition:opacity .4s ease;white-space:nowrap;}
  .save.on{opacity:1;}
  @media (max-width:420px){ .save-long{display:none;} }
  .save::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--terracotta);}
  .bar{max-width:680px;margin:12px auto 0;height:3px;background:var(--line);border-radius:3px;overflow:hidden;}
  .bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:3px;transition:width .5s cubic-bezier(.22,1,.36,1);}
  .bar-meta{max-width:680px;margin:8px auto 0;display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);letter-spacing:.02em;min-height:18px;}

  /* ---------- Scène ---------- */
  main{flex:1;display:flex;flex-direction:column;padding:0 16px calc(28px + env(safe-area-inset-bottom));}
  /* Question ancrée en haut : elle reste au même endroit d'un écran à l'autre */
  .stage{width:100%;max-width:680px;margin:0 auto;flex:1;display:flex;flex-direction:column;justify-content:flex-start;padding:44px 0 12px;}
  .card{animation:entree .42s cubic-bezier(.22,1,.36,1);}
  .card.back{animation:entree-retour .42s cubic-bezier(.22,1,.36,1);}
  @keyframes entree{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
  @keyframes entree-retour{from{opacity:0;transform:translateY(-14px);}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion: reduce){ .card,.card.back{animation:none;} .bar i{transition:none;} }

  .eyebrow{
    font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-soft);font-weight:600;display:flex;align-items:flex-start;gap:10px;margin:0 0 18px;line-height:1.5;
  }
  .eyebrow::before{content:"";width:26px;height:1px;background:var(--ink-soft);display:inline-block;flex:none;margin-top:.75em;}
  h1{font-size:clamp(32px,5.8vw,44px);line-height:1.1;margin:0 0 18px;}
  /* Même taille pour toutes les questions, courtes ou longues */
  h2.q{font-size:clamp(23px,3.7vw,28px);line-height:1.3;margin:0 0 26px;}
  .stem{font-size:15px;color:var(--ink-soft);margin:0 0 10px;}
  .lead{font-size:16.5px;color:var(--ink-soft);margin:0 0 16px;max-width:60ch;}
  .lead strong{color:var(--ink);font-weight:600;}
  .tag{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--terracotta);margin:0 0 10px;}

  .consigne{
    background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--terracotta);
    border-radius:10px;padding:14px 16px;margin:0 0 22px;font-size:14.5px;color:var(--ink-soft);
  }
  .consigne p{margin:0;}
  .consigne p + p{margin-top:8px;}
  details.consigne{padding:0;}
  details.consigne summary{cursor:pointer;list-style:none;padding:10px 16px;font-size:13px;font-weight:600;color:var(--ink-soft);}
  details.consigne summary::-webkit-details-marker{display:none;}
  details.consigne summary::after{content:" +";color:var(--terracotta);}
  details.consigne[open] summary::after{content:" \2212";}
  details.consigne > div{padding:0 16px 14px;}

  /* ---------- Réponses ---------- */
  .opts{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;}
  .opt{
    appearance:none;width:100%;text-align:left;cursor:pointer;
    display:flex;align-items:center;gap:14px;
    background:var(--surface);border:1px solid var(--line);border-radius:12px;
    padding:15px 18px;min-height:56px;font-size:16px;font-weight:500;color:var(--ink);
    box-shadow:0 1px 2px rgba(20,26,32,.04);
    transition:border-color .18s ease,background-color .18s ease,transform .18s ease,box-shadow .18s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .opt .k{
    flex:none;width:26px;height:26px;border-radius:7px;border:1px solid var(--line);
    display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--ink-soft);
    transition:all .18s ease;
  }
  @media (hover:hover){
    .opt:hover{border-color:var(--accent);box-shadow:var(--shadow);}
    .opt:hover .k{border-color:var(--accent);color:var(--accent);}
  }
  .opt:active{transform:scale(.99);}
  .opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .opt.sel{border-color:var(--accent);background:var(--accent-soft);}
  .opt.sel .k{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}

  /* Échelle en pourcentage (DES-II) : jauge qui se remplit jusqu'au choix */
  .scale{display:grid;grid-template-columns:repeat(11,1fr);gap:5px;}
  .scale .opt{
    --t:calc(var(--p) * 78% + 14%);
    position:relative;overflow:hidden;justify-content:center;gap:0;padding:0 2px;min-height:58px;text-align:center;
    font-size:13.5px;font-weight:600;white-space:nowrap;border-radius:10px;letter-spacing:-.01em;
    background:var(--surface);
  }
  /* Chaque bouton est rempli de bleu à hauteur de son pourcentage : vide à 0 %, plein à 100 % */
  .scale .opt::after{content:"";position:absolute;left:0;right:0;bottom:0;height:calc(var(--p) * 100%);background:color-mix(in srgb,var(--accent) 30%,transparent);transition:background-color .2s ease;}
  .scale .opt span{position:relative;z-index:1;}
  .scale .opt.on{border-color:color-mix(in srgb,var(--accent) 70%,var(--line));}
  .scale .opt.on::after{background:color-mix(in srgb,var(--accent) 72%,transparent);}
  .scale .opt.on.fonce{color:#fff;}
  .scale .opt.sel{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent);}
  .scale-ends{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-soft);margin-top:12px;}
  @media (hover:hover){ .scale .opt:hover{box-shadow:none;} .scale .opt.sel:hover{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent);} }
  @media (max-width:560px){
    .scale{grid-template-columns:repeat(6,1fr);gap:6px;}
    .scale .opt{min-height:52px;font-size:14px;}
  }

  /* Cases à cocher */
  .opt.chk .k{border-radius:6px;}
  .opt.chk.sel .k::after{content:"";width:9px;height:5px;border:2px solid var(--accent-ink);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px);}

  /* Champs */
  .field{display:block;margin:0 0 14px;}
  .field span{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin:0 0 6px;}
  .input{
    width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);
    border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-height:54px;
    transition:border-color .18s ease,box-shadow .18s ease;
  }
  textarea.input{min-height:150px;resize:vertical;line-height:1.55;}
  /* Nombre : saisie au clavier ou choix dans une liste */
  .nombre{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .nombre .input{width:150px;flex:none;font-variant-numeric:lining-nums tabular-nums;}
  .nombre .ou{font-size:14px;color:var(--ink-soft);}
  .liste{position:relative;flex:1 1 230px;max-width:320px;}
  .liste select{
    appearance:none;-webkit-appearance:none;width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);
    border:1px solid var(--line);border-radius:12px;padding:14px 44px 14px 16px;min-height:54px;cursor:pointer;
    transition:border-color .18s ease,box-shadow .18s ease;
  }
  .liste select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .liste svg{position:absolute;right:16px;top:50%;width:14px;height:14px;margin-top:-7px;pointer-events:none;color:var(--ink-soft);}
  .liste select.vide{color:var(--ink-soft);}
  @media (hover:hover){ .liste select:hover{border-color:var(--accent);} }
  @media (max-width:560px){
    .nombre{flex-direction:column;align-items:stretch;gap:8px;}
    .nombre .input,.liste{width:100%;max-width:none;flex:none;}
    .nombre .ou{display:flex;align-items:center;gap:12px;font-size:13px;}
    .nombre .ou::before,.nombre .ou::after{content:"";flex:1;height:1px;background:var(--line);}
  }
  .input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .input.err{border-color:#b42318;}
  .msg-err{font-size:13px;color:#b42318;margin:6px 0 0;min-height:0;}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .msg-err{color:#f19a8f;} :root:not([data-theme="light"]) .input.err{border-color:#f19a8f;} }

  /* Boutons */
  .actions{margin-top:22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
  .btn{
    appearance:none;border:0;cursor:pointer;background:var(--accent);color:var(--accent-ink);
    font-size:15.5px;font-weight:600;letter-spacing:.01em;border-radius:999px;padding:15px 30px;min-height:52px;
    box-shadow:var(--shadow);transition:transform .18s ease,opacity .18s ease,box-shadow .18s ease;
  }
  .btn:hover{transform:translateY(-1px);}
  .btn:active{transform:none;}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px;}
  .btn[disabled]{opacity:.45;cursor:default;transform:none;}
  .btn .fl{display:inline-block;margin-left:10px;transition:transform .18s ease;}
  .btn:hover .fl{transform:translateX(3px);}
  .link{appearance:none;background:none;border:0;padding:6px 0;cursor:pointer;font-size:14px;color:var(--ink-soft);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line);}
  .link:hover{color:var(--ink);text-decoration-color:currentColor;}

  /* Pied de question */
  .foot{width:100%;max-width:680px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;min-height:40px;}
  .foot .link{font-size:13.5px;}
  .foot .back::before{content:"\2190\00a0";}

  /* Accueil */
  .parts{list-style:none;margin:24px 0 8px;padding:0;border-top:1px solid var(--line);}
  .parts li{display:flex;gap:16px;align-items:baseline;padding:14px 0;border-bottom:1px solid var(--line);}
  .parts .n{font-family:'EB Garamond',Georgia,serif;font-size:26px;line-height:1;color:var(--terracotta);min-width:22px;}
  .parts b{display:block;font-weight:600;font-size:15px;}
  .parts span{font-size:13.5px;color:var(--ink-soft);}
  .note{font-size:13px;color:var(--ink-soft);margin:22px 0 0;max-width:62ch;}
  .note strong{color:var(--ink);}

  .status{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink-soft);margin:6px 0 0;}
  .status .pt{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none;}
  .status.ok .pt{background:#3d7a52;}
  .status.wait .pt{background:var(--terracotta);animation:pulse 1.2s ease-in-out infinite;}
  .status.err .pt{background:#b42318;}
  @keyframes pulse{50%{opacity:.35;}}
  .seal{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);margin:0 0 22px;}
  .seal.ok{animation:sceau .5s cubic-bezier(.22,1,.36,1);}
  @keyframes sceau{from{transform:scale(.6);opacity:0;}to{transform:none;opacity:1;}}
  .seal.err{background:#fbe4e1;color:#b42318;}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .seal.err{background:#3a2422;color:#f19a8f;} }
  :root[data-theme="dark"] .seal.err{background:#3a2422;color:#f19a8f;}
  .spin{width:56px;height:56px;margin:0 0 26px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:tourne .9s linear infinite;}
  @keyframes tourne{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion: reduce){ .spin{animation-duration:2.4s;} }
  .envoi-lead{font-size:16.5px;color:var(--ink-soft);margin:0 0 6px;max-width:52ch;}
  .seal svg{width:24px;height:24px;}

  @media (max-width:560px){
    .stage{justify-content:flex-start;padding-top:22px;}
    h2.q{margin-bottom:22px;}
    .opt{padding:14px 16px;}
    .btn{width:100%;}
    .actions{flex-direction:column;align-items:stretch;}
    .actions .link{text-align:center;}
  }
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="/">Cabinet Bouche &amp; Chmura</a>
    <span class="save" id="save" aria-live="polite">Enregistré<span class="save-long"> sur cet appareil</span></span>
  </div>
  <div class="bar" id="bar" hidden><i id="barFill"></i></div>
  <div class="bar-meta" id="barMeta" hidden><span id="barLeft"></span><span id="barRight"></span></div>
</header>
<main>
  <div class="stage" id="stage" aria-live="polite"></div>
  <div class="foot" id="foot"></div>
</main>

 en séance.\n\nSi à un moment vous vous sentez en danger ou avez des idées suicidaires, appelez le 3114 (numéro national de prévention du suicide, gratuit, 24 h/24) ou le 15 en cas d’urgence.","formulaires":[{"cle":"F1","titre":"Bilan dissociatif, partie 1 : entretien sur les expériences dissociatives","description":"Ce questionnaire fait partie de votre bilan. Il n’y a pas de bonne ou de mauvaise réponse : répondez simplement selon votre expérience. Si une question vous met mal à l’aise, vous pouvez la laisser de côté ou répondre « Je ne sais pas » ; nous pourrons en parler ensemble. Vos réponses sont reliées à votre dossier uniquement par le code qui vous a été transmis, sans votre nom. Les résultats ne constituent pas un diagnostic : ils seront lus, vérifiés et discutés avec vous en séance.\n\nSi à un moment vous vous sentez en danger ou avez des idées suicidaires, appelez le 3114 (numéro national de prévention du suicide, gratuit, 24 h/24) ou le 15 en cas d’urgence.\n\nCette partie reprend l’entretien structuré sur les troubles dissociatifs créé par le psychiatre Colin A. Ross (Dissociative Disorders Interview Schedule, DDIS), publié pour la première fois en 1989 dans la revue Dissociation (vol. 2, n° 3, p. 169-189). Vous en remplissez la version auto-administrée adaptée au DSM-5 (SR-DDIS), dont les résultats ont été comparés à ceux de l’entretien mené par un clinicien, avec une bonne concordance, par Ross et Browning dans le Journal of Trauma & Dissociation (2017, vol. 18, n° 1, p. 31-37). Traduction française de travail.\n\nDurée indicative : 30 à 45 minutes.","pages":[{"id":"P1_DEMO","titre":"Quelques informations générales"},{"id":"P1_TETE","titre":"Santé physique","gate":{"item":"D1","saut":{"N":"P1_SOMA"}}},{"id":"P1_MIGR","titre":"Santé physique (suite)"},{"id":"P1_SOMA","titre":"Symptômes physiques","description":"Pour chacun des symptômes physiques suivants, répondez Oui seulement si au moins une de ces conditions s’applique ou s’est appliquée : a) vous avez eu des pensées disproportionnées ou persistantes sur la gravité du symptôme ; b) vous avez eu un niveau d’anxiété élevé et persistant au sujet de votre santé ou du symptôme ; c) vous avez consacré un temps et une énergie excessifs à ce symptôme ou à ce souci de santé.\n\nAvez-vous déjà eu les symptômes physiques suivants ?"},{"id":"P1_SEXE","titre":"Symptômes physiques (suite)"},{"id":"P1_SUBST","titre":"Alcool et drogues"},{"id":"P1_ATCD","titre":"Antécédents de soins"},{"id":"P1_DEP_GATE","titre":"Humeur","gate":{"item":"D54","saut":{"N":"P1_SUIC"}}},{"id":"P1_DEP","titre":"Humeur (suite)","description":"Pendant cette période, avez-vous eu les symptômes suivants presque tous les jours pendant au moins deux semaines ?"},{"id":"P1_SUIC","titre":"Idées de mort","description":"Cette question est posée à tout le monde. Si vous traversez actuellement un moment difficile, vous pouvez appeler le 3114 à tout moment."},{"id":"P1_SCHN","titre":"Expériences inhabituelles"},{"id":"P1_SOMN_GATE","titre":"Sommeil et moments d’absence","gate":{"item":"D67","saut":{"N":"P1_TRANSE_GATE"}}},{"id":"P1_SOMN","titre":"Somnambulisme"},{"id":"P1_TRANSE_GATE","titre":"Moments d’absence","gate":{"item":"D69","saut":{"N":"P1_COMP_GATE"}}},{"id":"P1_TRANSE","titre":"Moments d’absence (suite)"},{"id":"P1_COMP_GATE","titre":"Enfance","gate":{"item":"D71","saut":{"N":"P1_PHYS_GATE"}}},{"id":"P1_COMP","titre":"Enfance (suite)"},{"id":"P1_PHYS_GATE","titre":"Violences subies pendant l’enfance","description":"Les questions suivantes portent sur des violences que vous auriez pu subir. Vous pouvez choisir de ne pas répondre.","gate":{"item":"D73","saut":{"N":"P1_SEX_GATE","R":"P1_SEX_GATE"}}},{"id":"P1_PHYS","titre":"Violences physiques (suite)"},{"id":"P1_SEX_GATE","titre":"Abus sexuels","gate":{"item":"D78","saut":{"N":"P1_ABUS18","R":"P1_ABUS18"}}},{"id":"P1_PHYS_SEX","titre":"Violences physiques et abus sexuels"},{"id":"P1_SEX","titre":"Abus sexuels (suite)","description":"Les questions suivantes décrivent en détail des formes d’abus sexuels que vous avez pu subir ou non. Elles servent uniquement à mieux comprendre la gravité de ce que vous avez vécu. Vous avez le choix de ne répondre à aucune, à certaines ou à toutes. Vous pouvez répondre Oui, Non, Je ne sais pas, ou Je préfère ne pas répondre."},{"id":"P1_ABUS18","titre":"Abus sexuels à l’âge adulte"},{"id":"P1_TDI","titre":"Mémoire et expériences du quotidien","description":"Pour les questions suivantes, indiquez si cela vous arrive jamais, occasionnellement, assez souvent ou fréquemment."},{"id":"P1_VOIX_GATE","titre":"Voix","gate":{"item":"D96","saut":{"N":"P1_AUTRE_GATE"}}},{"id":"P1_VOIX","titre":"Voix (suite)"},{"id":"P1_AUTRE_GATE","titre":"Sentiment de soi","gate":{"item":"D99","saut":{"N":"P1_SURN"}}},{"id":"P1_AUTRE","titre":"Sentiment de soi (suite)"},{"id":"P1_SURN","titre":"Expériences spirituelles ou surnaturelles","description":"Ces questions portent sur des expériences que beaucoup de personnes décrivent. Répondez simplement selon votre vécu."},{"id":"P1_BPD","titre":"Façon d’être habituelle","description":"Pour les neuf questions suivantes, répondez Oui seulement si vous avez été ainsi une grande partie du temps, pendant une grande partie de votre vie."},{"id":"P1_AMN_GATE","titre":"Mémoire","gate":{"item":"D117","saut":{"N":"P1_FUG_GATE1","I":"P1_FUG_GATE1"}}},{"id":"P1_AMN","titre":"Mémoire (suite)"},{"id":"P1_FUG_GATE1","titre":"Départs inexpliqués","gate":{"item":"D120","saut":{"N":"P1_DPDR"}}},{"id":"P1_FUG_GATE2","titre":"Départs inexpliqués (suite)","gate":{"item":"D121","saut":{"N":"P1_DPDR"}}},{"id":"P1_FUG","titre":"Départs inexpliqués (fin)"},{"id":"P1_DPDR","titre":"Sentiment d’irréalité","description":"La dépersonnalisation désigne le fait de se sentir détaché(e) de soi-même, de ses pensées, de ses émotions, de ses sensations ou de ses actes, ou de se sentir irréel(le) ou absent(e). La déréalisation désigne un sentiment d’irréalité ou de détachement vis-à-vis de ce qui vous entoure (les personnes ou les objets paraissent irréels, comme dans un rêve, dans le brouillard, sans vie ou visuellement déformés)."},{"id":"P1_TDI_GATE","titre":"États de personnalité","gate":{"item":"D127","saut":{"N":"FIN"}}},{"id":"P1_TDI_CRIT","titre":"États de personnalité (suite)"}]},{"cle":"F2","titre":"Bilan dissociatif, partie 2 : échelles d’expériences","description":"Ce questionnaire fait partie de votre bilan. Il n’y a pas de bonne ou de mauvaise réponse : répondez simplement selon votre expérience. Si une question vous met mal à l’aise, vous pouvez la laisser de côté ou répondre « Je ne sais pas » ; nous pourrons en parler ensemble. Vos réponses sont reliées à votre dossier uniquement par le code qui vous a été transmis, sans votre nom. Les résultats ne constituent pas un diagnostic : ils seront lus, vérifiés et discutés avec vous en séance.\n\nSi à un moment vous vous sentez en danger ou avez des idées suicidaires, appelez le 3114 (numéro national de prévention du suicide, gratuit, 24 h/24) ou le 15 en cas d’urgence.\n\nCette partie comprend trois questionnaires. Durée indicative : 25 à 35 minutes.","pages":[{"id":"P2_DES","titre":"Échelle des expériences dissociatives (DES-II)","description":"Ce questionnaire comprend 28 questions sur des expériences que vous pouvez avoir dans votre vie quotidienne. Pour chacune, indiquez le pourcentage du temps où cela vous arrive (0 % = jamais, 100 % = tout le temps), en dehors des moments où vous êtes sous l’influence de l’alcool ou de drogues."},{"id":"P2_SDQ","titre":"Questionnaire de dissociation somatoforme (SDQ-20)","description":"Voici des symptômes physiques que vous avez pu avoir pendant une période plus ou moins longue. Indiquez dans quelle mesure chacun s’applique à vous, ou s’est appliqué à vous au cours de l’année écoulée."},{"id":"P2_CDS","titre":"Échelle de dépersonnalisation de Cambridge (CDS)","description":"Ce questionnaire décrit des expériences plus ou moins étranges que des personnes bien portantes peuvent avoir dans leur vie quotidienne. Pour chacune, indiquez à quelle fréquence et combien de temps en général vous l’avez ressentie au cours des six derniers mois. Répondez aux deux questions (fréquence et durée) même si vous n’êtes pas tout à fait certain(e) de la meilleure réponse. Si la fréquence est « Jamais », choisissez « Sans objet (jamais) » pour la durée."}]},{"cle":"F3","titre":"Bilan dissociatif, partie 3 : vécu, humeur et contexte","description":"Ce questionnaire fait partie de votre bilan. Il n’y a pas de bonne ou de mauvaise réponse : répondez simplement selon votre expérience. Si une question vous met mal à l’aise, vous pouvez la laisser de côté ou répondre « Je ne sais pas » ; nous pourrons en parler ensemble. Vos réponses sont reliées à votre dossier uniquement par le code qui vous a été transmis, sans votre nom. Les résultats ne constituent pas un diagnostic : ils seront lus, vérifiés et discutés avec vous en séance.\n\nSi à un moment vous vous sentez en danger ou avez des idées suicidaires, appelez le 3114 (numéro national de prévention du suicide, gratuit, 24 h/24) ou le 15 en cas d’urgence.\n\nCette partie porte sur les événements difficiles que vous avez pu vivre, votre humeur, votre sommeil, votre santé, puis sur les expériences que vous vivez, pour mieux les situer dans votre histoire. Durée indicative : 25 à 40 minutes.","pages":[{"id":"P3_ITQ_EVT","titre":"Événement difficile (ITQ)","description":"Merci d’indiquer quelle est l’expérience qui vous perturbe le plus et de répondre aux questions suivantes par rapport à cette expérience."},{"id":"P3_ITQ_P","titre":"Réactions à cette expérience (ITQ)","description":"Voici une liste de problèmes que les personnes ont parfois après des expériences de vie stressantes ou traumatiques. Indiquez à quel point vous avez été perturbé(e) par chacun le mois dernier."},{"id":"P3_ITQ_C","titre":"Façon de vous sentir habituellement (ITQ)"},{"id":"P3_PHQ","titre":"Humeur (PHQ-9)"},{"id":"P3_GAD" I-XIV. Troubles dissociatifs (DSM-5)","t":"Avez-vous déjà vécu un départ soudain et inattendu loin de chez vous ou de votre lieu de travail habituel, avec une incapacité à vous souvenir de votre passé ?","ech":"ONI","type":"choix","page":"P1_FUG_GATE1"},{"id":"D121","instr":"DDIS","num":"121","sec":"XI-XIV. Troubles dissociatifs (DSM-5)","t":"Pendant cette période, avez-vous ressenti une confusion sur votre identité, ou avez-vous pris une identité en partie ou entièrement nouvelle ?","ech":"ONI","type":"choix","cond":"D120 != N","page":"P1_FUG_GATE2"},{"id":"D122","instr":"DDIS","num":"122","sec":"XI-XIV. Troubles dissociatifs (DSM-5)","t":"Ce départ et cette confusion sur votre identité étaient-ils dus à un problème physique connu (par exemple trous noirs lors d’une ivresse, accident vasculaire cérébral) ?","ech":"ONI","type":"choix","cond":"D120 != N && D121 != N","page":"P1_FUG"},{"id":"D123","instr":"DDIS","num":"123","sec":"XI-XIV. Troubles dissociatifs (DSM-5)","t":"Ces symptômes vous ont-ils causé une souffrance importante ou une gêne importante dans votre vie sociale ou professionnelle ?","ech":"ONI","type":"choix","cond":"D120 != N && D121 != N","page":"P1_FUG"},{"id":"D124a","instr":"DDIS","num":"124a","sec":"XI-XIV. Troubles dissociatifs (DSM-5)","t":"Avez-vous eu un ou plusieurs épisodes de dépersonnalisation ou de déréalisation suffisants pour vous causer une souffrance importante ou des problèmes dans votre travail ou votre vie sociale ?","ech":"ONI","type":"choix","page":"P1_DPDR"},{"id":"D124b","instr":"DDIS","num":"124b","sec":"XI-XIV. Troubles dissociatifs (DSM-5)","t":"Avez-vous déjà eu un fort sentiment d’irréalité qui a duré un certain temps, en dehors des moments où vous aviez consommé de l’alcool ou des drogues ?","ech":"ONI","type":"choix","page":"P1_DPDR"},{"id":"D125","instr":"DDIS","num":"125","sec":"XI-XIV. Troubles dissociatifs (DSM-5)","t":"Cette dépersonnalisation ou cette déréalisation était-elle due à un autre trouble, comme une schi ES","num":"1","sec":"DES-II","t":"Certaines personnes font l’expérience, alors qu’elles conduisent ou se trouvent dans une voiture (ou dans le métro ou le bus), de soudainement réaliser qu’elles ne se souviennent pas de ce qui est arrivé pendant tout ou partie du trajet.","ech":"DES","type":"lineaire_des","page":"P2_DES","req":true,"prefixe":"Indiquez le pourcentage du temps où cela vous arrive, en dehors des moments où vous êtes sous l’influence de l’alcool ou de drogues."},{"id":"DES2","instr":"DES","num":"2","sec":"DES-II","t":"Parfois, certaines personnes qui sont en train d’écouter quelqu’un parler réalisent soudain qu’elles n’ont pas entendu tout ou partie de ce qui vient d’être dit.","ech":"DES","type":"lineaire_des","page":"P2_DES","req":true,"prefixe":"Indiquez le pourcentage du temps où cela vous arrive, en dehors des moments où vous êtes sous l’influence de l’alcool ou de drogues."},{"id":"DES3","instr":"DES","num":"3","sec":"DES-II","t":"Certaines personnes font l’expérience de se trouver dans un lieu et de n’avoir aucune idée de la façon dont elles sont arrivées là.","ech":"DES","type":"lineaire_des","page":"P2_DES","req":true,"prefixe":"Indiquez le pourcentage du temps où cela vous arrive, en dehors des moments où vous êtes sous l’influence de l’alcool ou de drogues."},{"id":"DES4","instr":"DES","num":"4","sec":"DES-II","t":"Certaines personnes font l’expérience de se trouver vêtues d’habits qu’elles ne se souviennent pas avoir mis.","ech":"DES","type":"lineaire_des","page":"P2_DES","req":true,"prefixe":"Indiquez le pourcentage du temps où cela vous arrive, en dehors des moments où vous êtes sous l’influence de l’alcool ou de drogues."},{"id":"DES5","instr":"DES","num":"5","sec":"DES-II","t":"Certaines personnes font l’expérience de trouver des objets nouveaux dans leurs affaires sans se rappeler les avoir achetés.","ech":"DES","type":"lineaire_des","page":"P2_DES","req":true,"prefixe":"Indiquez le pourcentage du temps où cela vous arrive, en dehors des moments où vous êtes sous l’influence de l’alcool ou de drogues."},{"id":"DES6","instr":"DES","num":"6","sec":"DES-II","t":"Il arrive à certaines personnes d’être abordées par des gens qu’elles-mêmes ne reconnaissent pas. Ces inconnus les appellent par un nom qu’elles ne pensent pas être le leur ou affirment les connaître.","ech":"DES","type":"lineaire_des","page":"P2_DES","req":true,"prefixe":"Indiquez le pourcentage du temps où cela vous arrive, en dehors des moments où vous êtes sous l’influence de l’alcool ou de drogues."},{"id":"DES7","instr":"DES","num":"7","sec":"DES-II","t":"Certaines personnes ont parfois la sensation de se trouver à côté d’elles-mêmes ou de se voir elles-mêmes faire quelque chose, et de fait, elles se voient comme si elles regardaient une autre personne.","ech":"DES","type":"lineaire_des","page":"P2_DES","req":true,"prefixe":"Indiquez le pourcentage du temps où cela vous arrive, en dehors des moments où vous êtes sous l’influence de l’alcool ou de drogues."},{"id":"DES8","instr":"DES","num":"8","sec":"DES-II","t":"On dit parfois à certaines personnes qu’elles ne reconnaissent pas des amis ou des membres de leur famille.","ech":"DES","type":"lineaire_des","page":"P2_DES","req":true,"prefixe":"Indiquez le pourcentage du temps où cela vous arrive, en dehors des moments où vous êtes sous l’influence de l’alcool ou de drogues."},{"id":"DES9","instr":"DES","num":"9","sec":"DES-II","t":"Certaines personnes s’aperçoivent qu’elles n’ont pas de souvenir d’événements importants de leur vie (par exemple, cérémonies de mariage ou de remise d’un diplôme).","ech":"DES","type":"lineaire_des","page":"P2_DES","req":true,"prefixe":"Indiquez le pourcentage du temps où cela vous arrive, en dehors des moments où vous êtes sous l’influence de l’alcool ou de drogues."},{"id":"DES10","instr":"DES","num":"10","sec":"DES-II","t":"Certaines personnes font l’expérience d’être accusées de mentir alors qu’elles pensent ne pas avoir menti.","ech":"DES","type":"lineaire_des","page":"P2_DES","req":true,"prefixe":"Indiquez le pourcentage du temps où cela vous arrive, en dehors des moments où vous êtes sous l’influence de l’alcool ou de drogues."},{"id":"DES11","instr":"DES","num":"11","sec":"DES-II","t":"Certaines personnes font l’expérience de se regarder dans un miroir et de ne pas s’y reconnaître.","ech":"DES","type":"lineaire_des","page":"P2_DES","req":true,"prefixe":"Indiquez le pourcentage du temps où cela vous arrive, en dehors des moments où vous êtes sous l’influence de l’alcool ou de drogues."},{"id":"DES12","instr":"DES","num":"12","sec":"DES-II","t":"Certaines personnes font parfois l’expérience de ressentir comme irréels d’autres gens, des objets et le monde autour d’elles.","ech":"DES","type":"lineaire_des","page":"P2_DES","req":true,"prefixe":"Indiquez le pourcentage du temps où cela vous arrive, en dehors des moments où vous êtes sous l’influence de l’alcool ou de drogues."},{"id":"DES13","instr":"DES","num":"13","sec":"DES-II","t":"Certaines personnes ont parfois l’impression que leur corps ne leur appartient pas.","ech":"DES","type":"lineaire_des","page":"P2_DES","req":true,"prefixe":"Indiquez le pourcentage du temps où cela vous arrive, en dehors des moments où vous êtes sous l’influence de l’alcool ou de drogues."},{"id":"DES14","instr":"DES","num":"14","sec":"DES-II","t":"Certaines personnes font l’expérience de se souvenir parfois d’un événement passé de manière si vive qu’elles ressentent les choses comme si elles étaient en train de revivre cet événement.","ech":"DES","type":"lineaire_des","page":"P2_DES","req":true,"prefixe":"Indiquez le pourcentage du temps où cela vous arrive, en dehors des moments où vous êtes sous l’influence de l’alcool ou de drogues."},{"id":"DES15","instr":"DES","num":"15","sec":"DES-II","t":"Certaines personnes font l’expérience de ne pas être sûres si les choses dont elles se souviennent sont réellement arrivées ou si elles les ont juste rêvées.","ech":"DES","type":"lineaire_des","p u ne voir qu’une petite partie d’un objet)."},{"v":"SDQ14","l":"14. Être bien mieux ou bien moins capable de sentir les odeurs que d’habitude (alors que vous n’êtes pas enrhumé(e))."},{"v":"SDQ15","l":"15. Avoir l’impression que votre corps, ou une partie de votre corps, a disparu."},{"v":"SDQ16","l":"16. Ne pas pouvoir avaler, ou seulement avec beaucoup d’efforts."},{"v":"SDQ17","l":"17. Ne pas arriver à dormir pendant des nuits entières tout en restant actif ou active pendant la journée."},{"v":"SDQ18","l":"18. Ne pas pouvoir parler (ou seulement avec beaucoup d’efforts), ou ne pouvoir que chuchoter."},{"v":"SDQ19","l":"19. Être temporairement paralysé(e)."},{"v":"SDQ20","l":"20. Vous raidir temporairement."}],"cond":"ANY(SDQ1,SDQ2,SDQ3,SDQ4,SDQ5,SDQ6,SDQ7,SDQ8,SDQ9,SDQ10,SDQ11,SDQ12,SDQ13,SDQ14,SDQ15,SDQ16,SDQ17,SDQ18,SDQ19,SDQ20) != 1","page":"P2_SDQ"},{"id":"CDS1_F","instr":"CDS","num":"1 (fréquence)","sec":"CDS","t":"Soudainement, je me sens étrange, comme si je n’étais pas réel ou comme si j’étais coupé du monde.","ech":"CDS_FREQ","type":"choix","page":"P2_CDS","req":true},{"id":"CDS1_D","instr":"CDS","num":"1 (durée)","sec":"CDS","t":"Soudainement, je me sens étrange, comme si je n’étais pas réel ou comme si j’étais coupé du monde.","ech":"CDS_DUREE","type":"choix","cond":"CDS1_F != 0","page":"P2_CDS","req":true},{"id":"CDS2_F","instr":"CDS","num":"2 (fréquence)","sec":"CDS","t":"Ce que je vois paraît « plat » et « inanimé », comme si j’étais en train de regarder une image.","ech":"CDS_FREQ","type":"choix","page":"P2_CDS","req":true},{"id":"CDS2_D","instr":"CDS","num":"2 (durée)","sec":"CDS","t":"Ce que je vois paraît « plat » et « inanimé », comme si j’étais en train de regarder une image.","ech":"CDS_DUREE","type":"choix","cond":"CDS2_F != 0","page":"P2_CDS","req":true},{"id":"CDS3_F","instr":"CDS","num":"3 (fréquence)","sec":"CDS","t":"J’ai l’impression que des parties de mon corps ne m’appartiennent pas.","ech":"CDS_FREQ","type":"choix","page":"P2_CDS"," "sec":"Cartographie : Souvenirs qui s’imposent (reviviscences)","t":"Des souvenirs pénibles s’imposent-ils à vous au point de vous donner l’impression de revivre la scène ?","ech":"ONI","type":"choix","page":"P3_M_FLASH_GATE"},{"id":"M_FLASH_FREQ","instr":"LOCAL","num":"FLASH fréquence","sec":"Cartographie : Souvenirs qui s’imposent (reviviscences)","t":"À quelle fréquence cela vous est-il arrivé au cours du dernier mois ?","ech":"FREQ_MOIS","type":"choix","cond":"M_FLASH != N","page":"P3_M_FLASH"},{"id":"M_FLASH_INT","instr":"LOCAL","num":"FLASH intensité","sec":"Cartographie : Souvenirs qui s’imposent (reviviscences)","t":"Quand cela arrive, à quel point est-ce intense ?","ech":"INTENSITE","type":"choix","cond":"M_FLASH != N","page":"P3_M_FLASH"},{"id":"M_FLASH_ANC","instr":"LOCAL","num":"FLASH ancienneté","sec":"Cartographie : Souvenirs qui s’imposent (reviviscences)","t":"Depuis combien de temps cela existe-t-il ?","ech":"ANCIENNETE","type":"choix","cond":"M_FLASH != N","page":"P3_M_FLASH"},{"id":"M_FLASH_AGE","instr":"LOCAL","num":"FLASH âge de début","sec":"Cartographie : Souvenirs qui s’imposent (reviviscences)","t":"À quel âge approximatif vous souvenez-vous que cela a commencé ?","type":"nombre","cond":"M_FLASH != N","page":"P3_M_FLASH","saisie":"AGE_DEBUT","inconnu":true},{"id":"M_FLASH_EVOL","instr":"LOCAL","num":"FLASH évolution","sec":"Cartographie : Souvenirs qui s’imposent (reviviscences)","t":"Comment cela a-t-il évolué avec le temps ?","ech":"EVOLUTION","type":"choix","cond":"M_FLASH != N","page":"P3_M_FLASH"},{"id":"M_FLASH_DECL","instr":"LOCAL","num":"FLASH déclencheurs","sec":"Cartographie : Souvenirs qui s’imposent (reviviscences)","t":"Qu’est-ce qui semble déclencher ou favoriser ces moments ? (cochez tout ce qui s’applique)","ech":"DECLENCHEURS","type":"cases","cond":"M_FLASH != N","page":"P3_M_FLASH"},{"id":"M_FLASH_RET","instr":"LOCAL","num":"FLASH retentissement","sec":"Cartographie : Souvenirs qui s’imposent (reviviscences)","t":"À quel point cela vous gêne-t-il dans votre vie (travail, études, relations, vie quotidienne) ?","ech":"RETENTISSEMENT","type":"choix","cond":"M_FLASH != N","page":"P3_M_FLASH"},{"id":"M_FLASH_EX","instr":"LOCAL","num":"FLASH exemple","sec":"Cartographie : Souvenirs qui s’imposent (reviviscences)","t":"Si vous le souhaitez, décrivez un exemple récent avec vos propres mots.","type":"texte_long","cond":"M_FLASH != N","page":"P3_M_FLASH"},{"id":"CHRONO_TRT","instr":"LOCAL","num":"H1","sec":"Chronologie et message libre","t":"Suivez-vous actuellement un traitement ou un accompagnement (psychologique, psychiatrique, médical) ? Si oui, lequel et depuis quand ?","type":"texte","page":"P3_CHRONO"},{"id":"CHRONO_TXT","instr":"LOCAL","num":"H2","sec":"Chronologie et message libre","t":"Si vous le souhaitez, indiquez les grandes étapes de votre histoire en lien avec ce bilan : événements importants, périodes où ces expériences ont augmenté ou diminué, traitements suivis, avec votre âge approximatif à chaque étape.","type":"texte_long","page":"P3_CHRONO"},{"id":"FIN_TXT","instr":"LOCAL","num":"H3","sec":"Chronologie et message libre","t":"Y a-t-il autre chose que vous aimeriez me dire, ou une question que ce bilan n’a pas posée et qui vous semble importante ?","type":"texte_long","page":"P3_CHRONO"}]}</script>
<script>
(function () {
  'use strict';

  /* Adresse de l'application web du projet Apps Script du bilan dissociatif (doPost) */
  var URL_ENVOI = 'https://script.google.com/macros/s/AKfycbzWHclCBO8pmSoPe4B1jFOH6_sYPNsJvhZnHvVXgP-0B2NePRoOy3yUosV6_uc_tpKH/exec';
  var CLE = 'psypsy-bilan-dissociatif';
  var NB = ' ';

  var D = JSON.parse(document.getElementById('dico').textContent);
  var IDX = {};
  D.items.forEach(function (it) { IDX[it.id] = it; });

  /* ---------- Conditions de saut : même logique que bdEvalCond ---------- */
  function vide(v) { return v === null || v === undefined || v === '' || (Array.isArray(v) && v.length === 0); }
  function etendre(txt) {
    var m = txt.match(/^([A-Z_]+\d+)([a-z])\.\.([A-Z_]+\d+)([a-z])$/);
    if (m) { var out = []; for (var c = m[2].charCodeAt(0); c <= m[4].charCodeAt(0); c++) out.push(m[1] + String.fromCharCode(c)); return out; }
    return txt.split(',').map(function (s) { return s.trim(); });
  }
  function atome(a, R) {
    var m = a.trim().match(/^(ANY\(([^)]+)\)|[A-Za-z0-9_]+)\s*(==|!=)\s*(\S+)$/);
    if (!m) throw new Error('Condition illisible : ' + a);
    var cible = m[4], op = m[3], ids = m[2] ? etendre(m[2]) : [m[1]];
    function test(id) { var v = R[id]; if (vide(v)) return null; var eg = String(v) === cible; return op === '==' ? eg : !eg; }
    // ANY : vrai dès qu'une réponse donnée correspond ; une question sautée ne compte pas
    if (m[2]) { for (var i = 0; i < ids.length; i++) if (test(ids[i]) === true) return true; return false; }
    return test(ids[0]);
  }
  function evalCond(cond, R) {
    if (!cond) return true;
    var j = cond.match(/ANY\([^)]*\)\s*(?:==|!=)\s*\S+?(?=\s|\)|$)|[A-Za-z0-9_]+\s*(?:==|!=)\s*[^\s()]+|\|\||&&|\(|\)/g) || [], pos = 0;
    function ou(a, b) { if (a === true || b === true) return true; if (a === null || b === null) return null; return false; }
    function et(a, b) { if (a === false || b === false) return false; if (a === null || b === null) return null; return true; }
    function expr() { var v = terme(); while (j[pos] === '||') { pos++; v = ou(v, terme()); } return v; }
    function terme() { var v = facteur(); while (j[pos] === '&&') { pos++; v = et(v, facteur()); } return v; }
    function facteur() { var t = j[pos++]; if (t === '(') { var v = expr(); pos++; return v; } return atome(t, R); }
    return expr();
  }
  function applicable(id) { return evalCond(IDX[id].cond, S.R) !== false; }

  /* ---------- Structure des trois parties ---------- */
  var PARTIES = D.formulaires.map(function (f, n) {
    var pages = {}, ids = [];
    f.pages.forEach(function (p) {
      pages[p.id] = p;
      D.items.forEach(function (it) { if (it.page === p.id) ids.push(it.id); });
    });
    var t = f.titre.split(' : ');
    return {
      cle: f.cle, n: n + 1, nom: t.length > 1 ? t.slice(1).join(' : ') : f.titre,
      intro: f.description.replace(D.accueil, '').trim(),
      pages: pages, tous: ids,
      ids: ids.filter(function (id) { return id !== 'DEMO_SEXE'; })
    };
  });
  function partieDe(id) { for (var i = 0; i < PARTIES.length; i++) if (PARTIES[i].tous.indexOf(id) >= 0) return i; return -1; }

  /* ---------- État et sauvegarde automatique ---------- */
  var S;
  function neuf() { return { v: 1, ecran: 'accueil', partie: 0, item: null, pile: [], R: {}, identite: { nom: '', prenom: '', email: '' }, envois: {}, code: '', jeton: '' }; }
  function charger() {
    try { var x = JSON.parse(localStorage.getItem(CLE) || 'null'); if (x && x.v === 1) return x; } catch (e) {}
    return null;
  }
  var tSave;
  function sauver(visible) {
    try { localStorage.setItem(CLE, JSON.stringify(S)); } catch (e) { return; }
    if (visible) {
      var el = document.getElementById('save');
      el.classList.add('on'); clearTimeout(tSave);
      tSave = setTimeout(function () { el.classList.remove('on'); }, 1600);
    }
  }
  /* Retire les réponses devenues hors parcours (après un retour en arrière) */
  function purger() {
    var change = true;
    while (change) {
      change = false;
      Object.keys(S.R).forEach(function (id) {
        if (IDX[id] && IDX[id].cond && evalCond(IDX[id].cond, S.R) === false) { delete S.R[id]; change = true; }
      });
    }
  }

  /* ---------- Utilitaires d'affichage ---------- */
  var stage = document.getElementById('stage'), foot = document.getElementById('foot');
  var sens = 1;
  function h(tag, attrs, enfants) {
    var e = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === 'text') e.textContent = attrs[k];
      else if (k === 'html') e.innerHTML = attrs[k];
      else if (k.indexOf('on') === 0) e.addEventListener(k.slice(2), attrs[k]);
      else if (attrs[k] !== false && attrs[k] !== null && attrs[k] !== undefined) e.setAttribute(k, attrs[k]);
    });
    (enfants || []).forEach(function (c) { if (c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return e;
  }
  /* Typographie française : espace insécable avant : ; ! ? » et après « */
  /* Accords selon le sexe indiqué au début : « dégoûté » ou « dégoûtée », « fou » ou « folle »...
     La forme double est gardée quand le sexe n'est pas connu (réponse « Autre »). */
  var DOUBLES = [['Veuf', 'veuve'], ['actif', 'active'], ['bref', 'brève'], ['fou', 'folle'], ['spectateur', 'spectatrice']];
  /* Échelle de dépersonnalisation (CDS), écrite à la première personne au masculin : passages qui désignent la personne */
  var CDS_FEMININ = {
    1: [['pas réel ou', 'pas réelle ou'], ['coupé du monde', 'coupée du monde']],
    4: [['effrayé du tout', 'effrayée du tout']],
    6: [['un « observateur extérieur »', 'une « observatrice extérieure »']],
    15: [['je suis éveillé,', 'je suis éveillée,']],
    16: [['me sens détaché des', 'me sens détachée des']],
    22: [['si détaché de la douleur', 'si détachée de la douleur']],
    26: [['si détaché de mes pensées', 'si détachée de mes pensées']],
    27: [['être certain que', 'être certaine que']]
  };
  function genre(s) {
    var sexe = S && S.R ? S.R.DEMO_SEXE : null;
    if (sexe !== 'H' && sexe !== 'F') return s;
    var f = sexe === 'F';
    s = s.replace(/([A-Za-zÀ-ÿœ]+)\((e|le)\)/g, function (m, mot, fin) { return f ? mot + fin : mot; });
    DOUBLES.forEach(function (d) {
      s = s.replace(new RegExp('(^|[^A-Za-zÀ-ÿ])(' + d[0] + ') ou (' + d[1] + ')(?![A-Za-zÀ-ÿ])', 'gi'), function (m, avant, m1, m2) {
        var mot = f ? m2 : m1;
        return avant + (m1.charAt(0) === m1.charAt(0).toUpperCase() ? mot.charAt(0).toUpperCase() + mot.slice(1) : mot);
      });
    });
    return s;
  }
  function genreCDS(it, s) {
    if (it.instr !== 'CDS' || !S || !S.R || S.R.DEMO_SEXE !== 'F') return s;
    (CDS_FEMININ[parseInt(it.num, 10)] || []).forEach(function (r) { s = s.split(r[0]).join(r[1]); });
    return s;
  }
  function typo(s) { return genre(String(s).normalize('NFC')).replace(/[  ]([:;!?»%])/g, NB + '$1').replace(/«[  ]/g, '«' + NB).replace(/(\d) (h|à \d)/g, '$1' + NB + '$2').replace(/\b(p\.|n°|vol\.) (?=\d)/g, '$1' + NB); }
  /* Mots et expressions en anglais : en italique */
  var ANGLAIS = /Dissociative Disorders Interview Schedule|Journal of Trauma & Dissociation|Dissociation(?= \(vol)|flashbacks?/g;
  /* Texte enrichi : italiques pour l'anglais, gras pour les mots indiqués (rang des mots) */
  function riche(el, txt, gras) {
    txt = typo(txt);
    var morceaux = [], dernier = 0, m, n = 0;
    ANGLAIS.lastIndex = 0;
    while ((m = ANGLAIS.exec(txt))) { morceaux.push([txt.slice(dernier, m.index), false]); morceaux.push([m[0], true]); dernier = m.index + m[0].length; }
    morceaux.push([txt.slice(dernier), false]);
    morceaux.forEach(function (mc) {
      if (!mc[0]) return;
      var cible = mc[1] ? el.appendChild(h('em', { 'class': 'en', lang: 'en' })) : el;
      mc[0].split(/( )/).forEach(function (w) {
        if (w === ' ' || w === '') { if (w) cible.appendChild(document.createTextNode(w)); return; }
        var g = gras && gras.indexOf(n) >= 0; n++;
        cible.appendChild(g ? h('strong', { 'class': 'diff', text: w }) : document.createTextNode(w));
      });
    });
    return el;
  }
  function paragraphes(txt) {
    return String(txt).split(/\n+/).filter(function (s) { return s.trim(); }).map(function (s) { return riche(h('p'), s); });
  }
  /* Mot qui change entre deux questions presque identiques qui se suivent : rendu en gras */
  function racine(w) { return w.toLowerCase().replace(/[^a-zà-ÿœ’']/g, '').slice(0, 6); }
  function motsDifferents(a, b) {
    var A = typo(a).split(' '), B = typo(b).split(' ');
    if (A.length < 4 || B.length < 4) return [];
    var p = 0; while (p < A.length && p < B.length && A[p] === B[p]) p++;
    var q = 0; while (q < A.length - p && q < B.length - p && A[A.length - 1 - q] === B[B.length - 1 - q]) q++;
    var ma = A.slice(p, A.length - q), mb = B.slice(p, B.length - q), res = [];
    // Seulement si l'essentiel de la phrase est commun et que le passage qui change a la même longueur
    if (!ma.length || ma.length !== mb.length || p + q < 3 || (p + q) / A.length < 0.6) return [];
    ma.forEach(function (w, i) { if (racine(w) !== racine(mb[i])) res.push(p + i); });
    return res.length <= 2 ? res : [];
  }
  function voisin(it, pas) {
    var ids = PARTIES[S.partie].ids, i = ids.indexOf(it.id) + pas;
    for (; i >= 0 && i < ids.length; i += pas) if (applicable(ids[i])) return IDX[ids[i]].page === it.page && (IDX[ids[i]].type || 'choix') === (it.type || 'choix') ? IDX[ids[i]] : null;
    return null;
  }
  function grasPour(it, texte, texteDe) {
    var av = voisin(it, -1), ap = voisin(it, 1), g = av ? motsDifferents(texte, texteDe(av)) : [];
    if (!g.length && ap) g = motsDifferents(texte, texteDe(ap));
    return g;
  }
  var calme = false;
  function carte(enfants) {
    var c = h('div', { 'class': calme ? '' : 'card' + (sens < 0 ? ' back' : '') }, enfants);
    stage.innerHTML = ''; stage.appendChild(c);
    if (!calme) window.scrollTo(0, 0);
    return c;
  }
  function pied(gauche, droite) { foot.innerHTML = ''; foot.appendChild(gauche || h('span')); foot.appendChild(droite || h('span')); }
  function lienRetour() { return S.pile.length ? h('button', { 'class': 'link back', type: 'button', text: 'Retour', onclick: retour }) : null; }
  function barre(visible, ratio, gauche, droite) {
    document.getElementById('bar').hidden = !visible;
    document.getElementById('barMeta').hidden = !visible;
    if (!visible) return;
    document.getElementById('barFill').style.width = Math.round(Math.max(0, Math.min(1, ratio)) * 100) + '%';
    document.getElementById('barLeft').textContent = gauche || '';
    document.getElementById('barRight').textContent = droite || '';
  }
  function fleche() { return h('span', { 'class': 'fl', 'aria-hidden': 'true', text: '→' }); }
  function options(it) { return it.options || D.echelles[it.ech] || []; }

  /* Libellé de ligne d'une grille (même règle que bdLigneGrille) */
  function ligneGrille(it) {
    var t = it.t.replace(/^Vous a-t-on déjà diagnostiqué : /, '').replace(/^Vous a-t-on déjà prescrit : /, '')
      .replace(/^Si vous avez fait une tentative de suicide : /, '').replace(/^Auteur des violences physiques : /, '')
      .replace(/^Auteur des abus sexuels : /, '').replace(/^Perception extrasensorielle : /, '')
      .replace(/^Avez-vous déjà eu le sentiment d’être possédé\(e\) par /, '').replace(/^Avez-vous déjà été en contact avec /, '')
      .replace(/ \?$/, '');
    return t.charAt(0).toUpperCase() + t.slice(1);
  }
  /* Libellé adapté : sans la précision sur les règles ou la grossesse pour un homme */
  function libelle(it) { return S.R.DEMO_SEXE === 'H' && it.t_h ? it.t_h : it.t; }
  /* Le sexe étant connu, la mention « (Hommes) » ou « (Femmes) » devient inutile à l'écran */
  function sansMentionSexe(t) { return t.replace(/^\((Hommes|Femmes)\)\s*/, '').replace(/^\((Si vous êtes un homme|Si vous êtes une femme)\)\s*/, ''); }
  function capital(t) { return t.charAt(0).toUpperCase() + t.slice(1); }

  /* ---------- Navigation ---------- */
  function aller(ecran, partie, item, sansPile) {
    if (!sansPile) S.pile.push({ ecran: S.ecran, partie: S.partie, item: S.item });
    if (S.pile.length > 900) S.pile.splice(0, S.pile.length - 900);
    S.ecran = ecran; S.partie = partie; S.item = item;
    sens = 1; sauver(); rendu();
  }
  function retour() {
    var p = S.pile.pop();
    if (!p) return;
    S.ecran = p.ecran; S.partie = p.partie; S.item = p.item;
    sens = -1; sauver(); rendu();
  }
  function suivantDans(partie, apres) {
    var ids = PARTIES[partie].ids, i = apres ? ids.indexOf(apres) + 1 : 0;
    for (; i < ids.length; i++) if (applicable(ids[i])) return ids[i];
    return null;
  }
  function avancer() {
    purger();
    var nx = suivantDans(S.partie, S.item);
    if (nx) aller('question', S.partie, nx);
    else terminerPartie();
  }
  function terminerPartie() {
    var p = PARTIES[S.partie];
    S.envois[p.cle] = { statut: 'attente', id: (S.envois[p.cle] && S.envois[p.cle].id) || aleatoire() };
    S.pile = [];
    aller('transition', S.partie, null, true);
    envoyer();
  }
  function aleatoire() {
    var a = new Uint8Array(12);
    (window.crypto || window.msCrypto).getRandomValues(a);
    return Array.prototype.map.call(a, function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
  }

  /* ---------- Envoi de chaque partie au programme Apps Script ---------- */
  var envoiEnCours = false;
  function reponsesPartie(p) {
    var R = {};
    p.tous.forEach(function (id) { if (!vide(S.R[id]) && applicable(id)) R[id] = S.R[id]; });
    return R;
  }
  function envoyer() {
    if (envoiEnCours) return;
    var p = null;
    for (var i = 0; i < PARTIES.length; i++) { var e = S.envois[PARTIES[i].cle]; if (e && e.statut !== 'ok') { p = PARTIES[i]; break; } }
    if (!p) return;

        if (it.saisie === 'AGE' && n > 120) return erreur('Merci de vérifier votre âge.');
        if (it.saisie === 'HEURES' && n > 24) return erreur('Merci d’indiquer un nombre d’heures entre 0 et 24.');
        if (it.saisie === 'COMPTE' && n > 150) return erreur('Merci de vérifier ce nombre.');
        if ((it.saisie === 'AGE_DEBUT' || it.saisie === 'AGE_FIN') && n > age) return erreur('Cet âge est supérieur à votre âge actuel (' + age + ' ans).');
        if (it.saisie === 'AGE_FIN' && it.debut && estNombre(S.R[it.debut]) && n < Number(S.R[it.debut])) return erreur('Cet âge est inférieur à l’âge de début que vous avez indiqué (' + S.R[it.debut] + ' ans).');
      }
      avancer();
    }
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') valider(e); });
    setTimeout(function () { if (window.matchMedia('(hover:hover)').matches) input.focus({ preventScroll: true }); }, 60);
    return h('div', null, [
      h('div', { 'class': 'nombre' }, [input, h('span', { 'class': 'ou', text: 'ou' }), h('div', { 'class': 'liste' }, [select, chevron])]),
      err,
      h('div', { 'class': 'actions' }, [h('button', { 'class': 'btn', type: 'button', onclick: valider }, ['Suivant', fleche()])])
    ]);
  }

  function majStatut() {
    if (S.ecran !== 'transition') return;
    calme = true; rendu(); calme = false;
  }
  function ecranTransition() {
    var p = PARTIES[S.partie], derniere = S.partie === PARTIES.length - 1;
    var etats = PARTIES.slice(0, S.partie + 1).map(function (q) { return S.envois[q.cle] || {}; });
    var enErreur = etats.some(function (e) { return e.statut === 'erreur'; });
    var enAttente = !enErreur && etats.some(function (e) { return e.statut === 'attente'; });
    var confirme = !enErreur && !enAttente;
    barre(true, 1, 'Partie ' + p.n + ' sur ' + PARTIES.length, '100' + NB + '%');
    clearInterval(tDecompte);

    // Pendant l'envoi : cercle animé, rien d'autre
    if (enAttente) {
      carte([
        h('div', { 'class': 'spin', role: 'status', 'aria-label': 'Envoi en cours' }),
        h('p', { 'class': 'eyebrow', text: derniere ? 'Questionnaire terminé' : 'Partie ' + p.n + ' terminée' }),
        h('h2', { 'class': 'q', text: 'Envoi en cours…' }),
        h('p', { 'class': 'envoi-lead', text: typo('Envoi en cours, merci de patienter quelques instants, ne fermez pas la page.') })
      ]);
      return pied();
    }

    // Échec : message clair, nouvel essai automatique avec décompte
    if (enErreur) {
      var info = h('p', { 'class': 'status err' }, [h('span', { 'class': 'pt' }), h('span', { id: 'decompte' })]);
      var maj = function () {
        var sec = prochainEssai ? Math.max(0, Math.ceil((prochainEssai - Date.now()) / 1000)) : 0;
        var el = document.getElementById('decompte');
        if (el) el.textContent = typo(sec > 0 ? 'Nouvel essai automatique dans ' + sec + ' seconde' + (sec > 1 ? 's' : '') + '.' : 'Nouvel essai en cours…');
      };
      carte([
        h('div', { 'class': 'seal err', html: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8v5"/><path d="M12 16.5v.01"/><circle cx="12" cy="12" r="9"/></svg>' }),
        h('p', { 'class': 'eyebrow', text: derniere ? 'Questionnaire terminé' : 'Partie ' + p.n + ' terminée' }),
        h('h2', { 'class': 'q', text: typo('L’envoi n’a pas encore abouti') }),
        h('p', { 'class': 'envoi-lead', text: typo('La connexion semble interrompue. Vos réponses sont bien gardées sur cet appareil : gardez cette page ouverte, l’envoi sera retenté automatiquement. Vous pouvez aussi fermer la page et revenir plus tard, l’envoi reprendra à ce moment-là.') }),
        info,
        h('div', { 'class': 'actions' }, [h('button', { 'class': 'btn', type: 'button', onclick: relancer }, ['Réessayer maintenant'])])
      ]);
      maj(); tDecompte = setInterval(maj, 1000);
      return pied();
    }

    // Envoi confirmé par le serveur
    var coche = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';
    carte([
      h('div', { 'class': 'seal ok', html: coche }),
      h('p', { 'class': 'eyebrow', text: derniere ? 'Questionnaire terminé' : 'Partie ' + p.n + ' terminée' }),
      h('h1', { text: derniere ? 'Merci' + (S.identite.prenom ? ' ' + S.identite.prenom.split(' ')[0] : '') + '.' : 'Partie ' + p.n + ' enregistrée.' }),
      h('p', { 'class': 'lead', text: typo(derniere
        ? 'Vos réponses ont bien été enregistrées. Nous les reprendrons ensemble lors de notre prochain rendez-vous.'
        : 'Vos réponses ont bien été reçues par le cabinet. Vous pouvez enchaîner avec la partie ' + (p.n + 1) + ' maintenant ou plus tard : en revenant sur cette page, vous reprendrez ici.') }),
      derniere
        ? h('div', { 'class': 'actions' }, [
            h('a', { 'class': 'btn', href: '/', style: 'text-decoration:none;display:inline-flex;align-items:center' }, ['Retour au site', fleche()]),
            // Même ordinateur, autre personne (au cabinet par exemple) : on repart d'un questionnaire vierge
            h('button', { 'class': 'link', type: 'button', text: 'Remplir le questionnaire pour une autre personne', onclick: function () {
              try { localStorage.removeItem(CLE); } catch (e) {}
              S = neuf(); sens = 1; rendu();
            } })
          ])
        : h('div', { 'class': 'actions' }, [h('button', { 'class': 'btn', type: 'button', onclick: function () { aller('intro', S.partie + 1, null, true); } }, ['Continuer vers la partie ' + (p.n + 1), fleche()])])
    ]);
    pied();
  }

  /* Raccourcis clavier : chiffres pour répondre */
  document.addEventListener('keydown', function (e) {
    if (S.ecran !== 'question' && S.ecran !== 'sexe') return;
    if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (/^[1-9]$/.test(e.key)) { var b = stage.querySelector('.opt[data-k="' + e.key + '"]'); if (b) { e.preventDefault(); b.click(); } }
  });

  /* ---------- Démarrage : reprise automatique là où la personne s'était arrêtée ---------- */
  S = charger() || neuf();
  PARTIES.forEach(function (p) { var e = S.envois[p.cle]; if (e && e.statut === 'attente') e.statut = 'erreur'; });
  /* Anciennes réponses « Non concerné(e) » ou options retirées (version précédente de la page) : effacées pour être reposées */
  Object.keys(S.R).forEach(function (id) {
    var it = IDX[id], v = S.R[id];
    if (!it || it.type === 'nombre' || it.type === 'texte' || it.type === 'texte_long' || it.type === 'cases') return;
    if (options(it).length && !options(it).some(function (o) { return o.v === v; })) delete S.R[id];
  });
  rendu();
  if (PARTIES.some(function (p) { var e = S.envois[p.cle]; return e && e.statut !== 'ok'; })) relancer();
})();
</script>
