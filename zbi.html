<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<script>if(/[?&]fiche(=|&|$)/.test(location.search)){document.documentElement.className+=" vue-fiche";}</script>
<style>html.vue-fiche body{visibility:hidden}</style>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZBI — Échelle de Zarit (fardeau de l'aidant)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{color-scheme:light}
  *{box-sizing:border-box;}
  body{margin:0;padding:0;background:#F4F1EA;color:#20241E;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;line-height:1.6;}
  h1,h2,.serif{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;color:#20241E;}
  .wrap{max-width:640px;margin:0 auto;padding:40px 24px 80px;}
  .eyebrow{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:#63695D;font-weight:600;display:flex;align-items:center;gap:10px;margin-bottom:22px;}
  .eyebrow::before{content:"";width:26px;height:1px;background:#63695D;display:inline-block;}
  .card{background:#FFFFFF;border:1px solid #E0D9C9;border-radius:16px;padding:32px;box-shadow:0 1px 2px rgba(20,26,32,.06), 0 18px 34px -20px rgba(20,26,32,.28);}
  h1{font-size:26px;margin:0 0 12px;}
  .lead{font-size:14.5px;color:#63695D;margin:0 0 20px;}
  .pill-row{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 26px;}
  .pill{font-size:12px;font-weight:600;color:#63695D;background:#F4F1EA;border:1px solid #E0D9C9;border-radius:999px;padding:5px 12px;}
  .start-btn{background:#E8A62E;color:#fff;border:none;border-radius:10px;padding:14px 26px;font-family:'Inter',sans-serif;font-size:14.5px;font-weight:700;cursor:pointer;}
  .lang-note{font-size:12px;color:#9A9E90;font-style:italic;margin:0 0 20px;}
  .progress{font-size:12px;color:#9A9E90;margin:0 0 14px;}
  .q-text{font-size:16px;margin:0 0 20px;}
  .opt-row{display:flex;flex-direction:column;gap:8px;}
  .opt{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid #E0D9C9;border-radius:10px;cursor:pointer;font-size:14px;}
  .opt.selected{border-color:#E8A62E;background:#FDF3DD;}
  .nav-row{display:flex;justify-content:space-between;margin-top:24px;}
  .btn{appearance:none;text-decoration:none;display:inline-flex;align-items:center;gap:6px;font-family:'Inter',sans-serif;font-size:13.5px;font-weight:700;border-radius:10px;padding:10px 18px;cursor:pointer;border:1px solid transparent;}
  .btn-secondary{background:#F4F1EA;color:#1E3A5F;border-color:#E0D9C9;}
  .btn-primary{background:#E8A62E;color:#fff;}
  .btn[disabled]{opacity:.4;cursor:not-allowed;}
  .result-score{font-family:'Cormorant Garamond',Georgia,serif;font-size:44px;color:#E8A62E;margin:0 0 4px;}
  .result-max{font-size:14px;color:#9A9E90;margin:0 0 18px;}
  .result-text{font-size:14.5px;color:#20241E;margin:0 0 12px;}
  .subscale-row{display:flex;justify-content:space-between;font-size:13.5px;border-top:1px solid #E0D9C9;padding:8px 0;}
  .subscale-row b{color:#1E3A5F;}
  .footnote{margin-top:32px;font-size:11.5px;color:#63695D;border-top:1px solid #E0D9C9;padding-top:16px;}
  @media print{ .no-print{display:none!important;} body{background:#fff;} .card{box-shadow:none;border:none;} }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow no-print">Cabinet Bouche &amp; Chmura</div>

  <div id="screen-start" class="card">
    <h1 class="serif">ZBI — Échelle de Zarit</h1>
    <p class="lead">Ce questionnaire évalue le fardeau ressenti par l'aidant d'un proche dépendant (parent âgé, malade ou en situation de handicap), à travers 22 affirmations.</p>
    
    <div class="pill-row">
      <span class="pill">22 questions</span>
      <span class="pill">6 minutes</span>
      <span class="pill">Échelle 0-4</span>
    </div>
    <button class="start-btn" id="btn-start">Commencer</button>
  </div>

  <div id="screen-quiz" class="card" hidden>
    <p class="progress" id="progress-text"></p>
    <p class="q-text" id="q-text"></p>
    <div class="opt-row" id="opt-row"></div>
    <div class="nav-row no-print">
      <button class="btn btn-secondary" id="btn-prev">Précédent</button>
      <button class="btn btn-primary" id="btn-next" disabled>Suivant</button>
    </div>
  </div>

  <div id="screen-result" class="card" hidden>
    <h1 class="serif">Résultat</h1>
    <div id="result-body"></div>
    <div class="nav-row no-print">
      <button class="btn btn-secondary" id="btn-restart">Recommencer</button>
      <button class="btn btn-primary" id="btn-print">Imprimer / PDF</button>
    </div>
  </div>
</div>

<script>
(function(){
  var items = [{"t": "Sentir que votre parent vous demande plus d'aide qu'il n'en a besoin ?", "opts": ["0 — Jamais", "1 — Rarement", "2 — Quelquefois", "3 — Assez souvent", "4 — Presque toujours"]}, {"t": "Sentir que le temps consacré à votre parent ne vous en laisse pas assez pour vous ?", "opts": ["0 — Jamais", "1 — Rarement", "2 — Quelquefois", "3 — Assez souvent", "4 — Presque toujours"]}, {"t": "Vous sentir tiraillé entre les soins à votre parent et vos autres responsabilités (familiales ou de travail) ?", "opts": ["0 — Jamais", "1 — Rarement", "2 — Quelquefois", "3 — Assez souvent", "4 — Presque toujours"]}, {"t": "Vous sentir embarrassé par les comportements de votre parent ?", "opts": ["0 — Jamais", "1 — Rarement", "2 — Quelquefois", "3 — Assez souvent", "4 — Presque toujours"]}, {"t": "Vous sentir en colère quand vous êtes en présence de votre parent ?", "opts": ["0 — Jamais", "1 — Rarement", "2 — Quelquefois", "3 — Assez souvent", "4 — Presque toujours"]}, {"t": "Sentir que votre parent nuit à vos relations avec d'autres membres de la famille ou des amis ?", "opts": ["0 — Jamais", "1 — Rarement", "2 — Quelquefois", "3 — Assez souvent", "4 — Presque toujours"]}, {"t": "Avoir peur de ce que l'avenir réserve à votre parent ?", "opts": ["0 — Jamais", "1 — Rarement", "2 — Quelquefois", "3 — Assez souvent", "4 — Presque toujours"]}, {"t": "Sentir que votre parent est dépendant de vous ?", "opts": ["0 — Jamais", "1 — Rarement", "2 — Quelquefois", "3 — Assez souvent", "4 — Presque toujours"]}, {"t": "Vous sentir tendu en présence de votre parent ?", "opts": ["0 — Jamais", "1 — Rarement", "2 — Quelquefois", "3 — Assez souvent", "4 — Presque toujours"]}, {"t": "Sentir que votre santé s'est détériorée à cause de votre implication auprès de votre parent ?", "opts": ["0 — Jamais", "1 — Rarement", "2 — Quelquefois", "3 — Assez souvent", "4 — Presque toujours"]}, {"t": "Sentir que vous n'avez pas autant d'intimité que vous aimeriez à cause de votre parent ?", "opts": ["0 — Jamais", "1 — Rarement", "2 — Quelquefois", "3 — Assez souvent", "4 — Presque toujours"]}, {"t": "Sentir que votre vie sociale s'est détériorée du fait que vous prenez soin de votre parent ?", "opts": ["0 — Jamais", "1 — Rarement", "2 — Quelquefois", "3 — Assez souvent", "4 — Presque toujours"]}, {"t": "Vous sentir mal à l'aise de recevoir des amis à cause de votre parent ?", "opts": ["0 — Jamais", "1 — Rarement", "2 — Quelquefois", "3 — Assez souvent", "4 — Presque toujours"]}, {"t": "Sentir que votre parent semble s'attendre à ce que vous preniez soin de lui comme si vous étiez la seule personne sur qui il puisse compter ?", "opts": ["0 — Jamais", "1 — Rarement", "2 — Quelquefois", "3 — Assez souvent", "4 — Presque toujours"]}, {"t": "Sentir que vous n'avez pas assez d'argent pour prendre soin de votre parent encore longtemps compte tenu de vos autres dépenses ?", "opts": ["0 — Jamais", "1 — Rarement", "2 — Quelquefois", "3 — Assez souvent", "4 — Presque toujours"]}, {"t": "Sentir que vous ne serez plus capable de prendre soin de votre parent encore bien longtemps ?", "opts": ["0 — Jamais", "1 — Rarement", "2 — Quelquefois", "3 — Assez souvent", "4 — Presque toujours"]}, {"t": "Sentir que vous avez perdu le contrôle de votre vie depuis la maladie de votre parent ?", "opts": ["0 — Jamais", "1 — Rarement", "2 — Quelquefois", "3 — Assez souvent", "4 — Presque toujours"]}, {"t": "Souhaiter pouvoir laisser le soin de votre parent à quelqu'un d'autre ?", "opts": ["0 — Jamais", "1 — Rarement", "2 — Quelquefois", "3 — Assez souvent", "4 — Presque toujours"]}, {"t": "Sentir que vous ne savez pas trop quoi faire pour votre parent ?", "opts": ["0 — Jamais", "1 — Rarement", "2 — Quelquefois", "3 — Assez souvent", "4 — Presque toujours"]}, {"t": "Sentir que vous devriez en faire plus pour votre parent ?", "opts": ["0 — Jamais", "1 — Rarement", "2 — Quelquefois", "3 — Assez souvent", "4 — Presque toujours"]}, {"t": "Sentir que vous pourriez donner de meilleurs soins à votre parent ?", "opts": ["0 — Jamais", "1 — Rarement", "2 — Quelquefois", "3 — Assez souvent", "4 — Presque toujours"]}, {"t": "En fin de compte, à quelle fréquence vous arrive-t-il de sentir que les soins à votre parent sont une charge, un fardeau ?", "opts": ["0 — Jamais", "1 — Rarement", "2 — Quelquefois", "3 — Assez souvent", "4 — Presque toujours"]}];
  var answers = new Array(items.length).fill(null);
  var idx = 0;

  function renderQuestion(){
    document.getElementById('progress-text').textContent = 'Question ' + (idx+1) + ' / ' + items.length;
    document.getElementById('q-text').textContent = items[idx].t;
    var row = document.getElementById('opt-row');
    row.innerHTML = '';
    items[idx].opts.forEach(function(label, v){
      var d = document.createElement('div');
      d.className = 'opt' + (answers[idx] === v+1 ? ' selected' : '');
      d.textContent = label;
      d.addEventListener('click', function(){
        answers[idx] = v+1;
        renderQuestion();
      });
      row.appendChild(d);
    });
    document.getElementById('btn-prev').disabled = idx === 0;
    document.getElementById('btn-next').disabled = answers[idx] === null;
    document.getElementById('btn-next').textContent = idx === items.length - 1 ? 'Voir le résultat' : 'Suivant';
  }

  document.getElementById('btn-start').addEventListener('click', function(){
    document.getElementById('screen-start').hidden = true;
    document.getElementById('screen-quiz').hidden = false;
    renderQuestion();
  });

  document.getElementById('btn-prev').addEventListener('click', function(){
    if (idx > 0){ idx--; renderQuestion(); }
  });

  document.getElementById('btn-next').addEventListener('click', function(){
    if (answers[idx] === null) return;
    if (idx < items.length - 1){
      idx++; renderQuestion();
    } else {
      showResult();
    }
  });

  function computeResult(){
    
    var total = answers.reduce(function(a,b){return a + (b-1);}, 0);
    var html = '';
    html += '<p class="result-score">' + total + ' / 88</p>';
    html += '<p class="result-max">score total (0 à 88)</p>';
    var niveau;
    if (total <= 20) niveau = 'charge faible ou nulle';
    else if (total <= 40) niveau = 'charge légère à modérée';
    else if (total <= 60) niveau = 'charge modérée à sévère';
    else niveau = 'charge sévère';
    html += '<p class="result-text"><b>Niveau indicatif : ' + niveau + '.</b></p>';
    html += '<p class="result-text">Grille de lecture usuelle en pratique clinique française : 0-20 charge faible/nulle · 21-40 légère à modérée · 41-60 modérée à sévère · 61-88 sévère. Il ne s\'agit pas d\'un seuil validé par Zarit et al. (1980) eux-mêmes, mais d\'une convention clinique courante.</p>';
    document.getElementById('result-body').innerHTML = html;

  }

  function showResult(){
    document.getElementById('screen-quiz').hidden = true;
    document.getElementById('screen-result').hidden = false;
    computeResult();
  }

  document.getElementById('btn-restart').addEventListener('click', function(){
    answers = new Array(items.length).fill(null);
    idx = 0;
    
    document.getElementById('screen-result').hidden = true;
    document.getElementById('screen-start').hidden = false;
  });
  document.getElementById('btn-print').addEventListener('click', function(){ window.print(); });
})();

</script>

<div class="wrap">
  <div class="eyebrow">Cabinet Bouche &amp; Chmura</div>

  <div class="fiche-photo"><span class="acronym">ZBI</span></div>

  </div>

  <div class="section">
    <h2 class="serif">Présentation de l'outil</h2>
    <p>Le ZBI (échelle de Zarit) mesure le fardeau subjectif ressenti par l'aidant familial d'une personne âgée ou dépendante. Cette page reprend la version longue à 22 items (Zarit, Reever &amp; Bach-Peterson, 1980), traduction française de référence (Hébert, Bravo &amp; Préville, 1993).</p>
    <p>Il existe également une version courte (ZBI-12, Bédard et al., 2001) non reproduite ici en page séparée.</p>
  </div>

</template>
<script>
(function(){
  if(!/[?&]fiche(=|&|$)/.test(location.search)) return;
  function afficherFiche(){
    var t = document.getElementById('fiche-src');
    if(!t) return;
    var html = '<!doctype html><html lang="fr">' + t.innerHTML + '</html>';
    document.open(); document.write(html); document.close();
  }
  if(document.readyState === 'loading'){ document.addEventListener('DOMContentLoaded', afficherFiche); }
  else { afficherFiche(); }
})();
</script>
</body>
