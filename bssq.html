<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BSSQ — Questionnaire des situations scolaires de Barkley</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{color-scheme:light}
  *{box-sizing:border-box;}
  body{margin:0;padding:0;background:#F4F1EA;color:#20241E;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;line-height:1.6;}
  h1,.serif{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;color:#20241E;}
  .wrap{max-width:720px;margin:0 auto;padding:0 24px 80px;}
  .eyebrow{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:#63695D;font-weight:600;display:flex;align-items:center;gap:10px;margin:32px 0 18px;}
  .eyebrow::before{content:"";width:26px;height:1px;background:#63695D;display:inline-block;}
  h1{font-size:25px;margin:0 0 18px;}
  .intro{font-size:14.5px;color:#4A4E43;background:#fff;border:1px solid #E0D9C9;border-radius:12px;padding:16px 18px;margin-bottom:24px;}
  .item{background:#fff;border:1px solid #E0D9C9;border-radius:12px;padding:16px 18px;margin-bottom:14px;}
  .item p{font-size:14.5px;margin:0 0 12px;font-weight:600;}
  .row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .yn{display:flex;gap:8px;}
  .opt{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;padding:6px 12px;border:1px solid #E0D9C9;border-radius:999px;}
  .opt:hover{background:#F4F1EA;}
  .sev{display:none;margin-top:12px;}
  .sev.show{display:block;}
  .sev label{font-size:12.5px;color:#63695D;display:block;margin-bottom:6px;}
  .sev-opts{display:flex;gap:6px;flex-wrap:wrap;}
  .sev-opt{font-size:12px;padding:6px 10px;border:1px solid #E0D9C9;border-radius:8px;cursor:pointer;}
  .sev-opt:hover{background:#F4F1EA;}
  .btn{appearance:none;text-decoration:none;display:inline-flex;align-items:center;gap:6px;font-family:'Inter',sans-serif;font-size:13.5px;font-weight:700;border-radius:10px;padding:12px 22px;cursor:pointer;border:1px solid transparent;background:#5C7A2E;color:#fff;margin-top:10px;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  #result{display:none;margin-top:30px;}
  .score-card{background:#fff;border:1px solid #E0D9C9;border-radius:12px;padding:18px 20px;margin-bottom:14px;}
  .score-card h3{margin:0 0 6px;font-size:16px;font-family:'Cormorant Garamond',Georgia,serif;}
  .score-val{font-size:22px;font-weight:700;}
  .cutoffs{font-size:12.5px;color:#63695D;margin-top:6px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Cabinet Bouche &amp; Chmura</div>
  <h1 class="serif">Questionnaire des situations scolaires de Barkley (BSSQ)</h1>
  <div class="intro">
    Does this child present any behavior problems for you in any of these situations? If yes,
    please indicate how severe they are (1 = léger, 9 = sévère).
  </div>
  <div id="quiz"></div>
  <button class="btn" id="submitBtn" type="button" disabled>Voir mes résultats</button>

  <div id="result">
    <h2 class="serif">Vos résultats</h2>
    <div id="cards"></div>
  </div>
</div>

<script>
(function(){
  var SITUATIONS = [
    "While Arriving at School",
    "During Individual Desk Work",
    "During Small Group Activities",
    "During Free Play Time in Class",
    "During Lectures to the Class",
    "At Recess",
    "At Lunch",
    "In the Hallway",
    "In the Bathroom",
    "On Field Trips",
    "During Special Assemblies",
    "On the Bus"
  ];

  var yn = {};    // idx -> 'oui'/'non'
  var sev = {};   // idx -> 1..9

  var quizEl = document.getElementById('quiz');
  var html = '';
  SITUATIONS.forEach(function(s, idx){
    html += '<div class="item" data-idx="' + idx + '"><p>' + (idx+1) + '. ' + s + '</p>';
    html += '<div class="row"><div class="yn">' +
      '<label class="opt"><input type="radio" name="yn' + idx + '" value="oui" style="display:none">Oui</label>' +
      '<label class="opt"><input type="radio" name="yn' + idx + '" value="non" style="display:none">Non</label>' +
      '</div></div>';
    html += '<div class="sev" id="sev' + idx + '"><label>Sévérité (1 = légère, 9 = sévère)</label><div class="sev-opts">';
    for (var v=1; v<=9; v++){
      html += '<span class="sev-opt" data-idx="' + idx + '" data-val="' + v + '">' + v + '</span>';
    }
    html += '</div></div></div>';
  });
  quizEl.innerHTML = html;

  var submitBtn = document.getElementById('submitBtn');

  function checkComplete(){
    var ok = true;
    SITUATIONS.forEach(function(s, idx){
      if (yn[idx] === undefined) ok = false;
      if (yn[idx] === 'oui' && sev[idx] === undefined) ok = false;
    });
    submitBtn.disabled = !ok;
  }

  quizEl.querySelectorAll('.opt').forEach(function(label){
    label.addEventListener('click', function(){
      var input = label.querySelector('input');
      var item = label.closest('.item');
      var idx = item.getAttribute('data-idx');
      var group = item.querySelectorAll('.opt');
      group.forEach(function(o){ o.style.background=''; o.style.borderColor='#E0D9C9'; o.style.color=''; });
      label.style.background = '#5C7A2E';
      label.style.color = '#fff';
      label.style.borderColor = '#5C7A2E';
      yn[idx] = input.value;
      var sevBox = document.getElementById('sev' + idx);
      if (input.value === 'oui'){
        sevBox.classList.add('show');
      } else {
        sevBox.classList.remove('show');
        delete sev[idx];
      }
      checkComplete();
    });
  });

  quizEl.querySelectorAll('.sev-opt').forEach(function(el){
    el.addEventListener('click', function(){
      var idx = el.getAttribute('data-idx');
      var val = parseInt(el.getAttribute('data-val'), 10);
      var box = document.getElementById('sev' + idx);
      box.querySelectorAll('.sev-opt').forEach(function(o){ o.style.background=''; o.style.color=''; o.style.borderColor='#E0D9C9'; });
      el.style.background = '#5C7A2E';
      el.style.color = '#fff';
      el.style.borderColor = '#5C7A2E';
      sev[idx] = val;
      checkComplete();
    });
  });

  submitBtn.addEventListener('click', function(){
    var count = 0;
    var sevSum = 0;
    SITUATIONS.forEach(function(s, idx){
      if (yn[idx] === 'oui'){ count += 1; sevSum += (sev[idx] || 0); }
    });
    var sevMean = (sevSum / SITUATIONS.length).toFixed(1);
    var cards = document.getElementById('cards');
    var html2 = '<div class="score-card"><h3>Situations problématiques</h3><div class="score-val">' + count + ' / 12</div></div>' +
      '<div class="score-card"><h3>Sévérité moyenne</h3><div class="score-val">' + sevMean + ' / 9</div>' +
      '<p class="cutoffs">Aucun seuil clinique officiel publié — profil descriptif à discuter avec ' +
      'les parents et, le cas échéant, l\'équipe scolaire.</p></div>';
    cards.innerHTML = html2;
    document.getElementById('result').style.display = 'block';
    submitBtn.style.display = 'none';
    document.getElementById('result').scrollIntoView({behavior:'smooth'});
  });
})();
</script>
</body>
</html>
